<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrapper d-flex">

    <div id="sidebar" class="sidebar">
        <h4 class="text-white text-center py-3">Dashboard</h4>
        <ul class="nav flex-column px-2">
            <li><a href="#" class="nav-link active">🏠 Home</a></li>
            <li><a href="#" class="nav-link">📊 Analytics</a></li>
            <li><a href="#" class="nav-link">📁 Projects</a></li>
            <li><a href="#" class="nav-link">👥 Users</a></li>
            <li><a href="#" class="nav-link">⚙️ Settings</a></li>
        </ul>
    </div>

    <div class="main-content w-100">

        <nav class="navbar bg-white shadow-sm px-3">
            <button class="btn btn-outline-primary" id="toggleBtn">☰</button>
            <span class="fw-bold">Dashboard</span>
            <span>👤 Admin</span>
        </nav>

        <div class="container-fluid mt-4">

            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="card p-3">
                        <h6>Revenue</h6>
                        <h4>₹1,20,000</h4>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3">
                        <h6>Users</h6>
                        <h4>1,250</h4>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3">
                        <h6>Orders</h6>
                        <h4>320</h4>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3">
                        <h6>Growth</h6>
                        <h4 class="text-success">+12%</h4>
                    </div>
                </div>
            </div>

            <div class="card-container">
                <div class="responsive-card">Card 1</div>
                <div class="responsive-card">Card 2</div>
                <div class="responsive-card">Card 3</div>
            </div>

        </div>
    </div>
</div>

<script>
const toggleBtn = document.getElementById("toggleBtn");
const sidebar = document.getElementById("sidebar");

toggleBtn.addEventListener("click", () => {
    sidebar.classList.toggle("collapsed");
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
