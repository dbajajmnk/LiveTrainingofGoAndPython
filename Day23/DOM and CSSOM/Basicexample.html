<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSSOM AND DOM</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div id="box">
        <h1>CSSOM AND DOM</h1>
        <p>CSSOM (CSS Object Model) and DOM (Document Object Model) are two important concepts in web development that allow developers to manipulate and interact with web pages dynamically.</p>
    </div>
</body>
<script>
    // Accessing the DOM
    console.log("Dom", document); // Logs the entire document object
    const box = document.getElementById('box');
    
    console.log(box); // Logs the div element with id "box"

    // Modifying the DOM
    box.style.backgroundColor = 'lightblue'; 
    box.style.color = 'white';
    box.style.border = '1px solid #ccc'; // Changes the border of the box

    // Accessing CSSOM
    const computedStyle = window.getComputedStyle(box);
    console.log("CSSOM",computedStyle); // Logs the computed background color of the box
</script>
</html>
